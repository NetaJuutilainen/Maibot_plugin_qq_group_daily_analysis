<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3c6e"/>
      <stop offset="1" stop-color="#131c33"/>
    </linearGradient>
  </defs>

  <!-- V2：深蓝底板 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- 底影 -->
  <ellipse cx="32" cy="57.5" rx="17" ry="2.2" fill="#000000" opacity="0.35"/>

  <!-- V3：微倾斜的页面 -->
  <g transform="rotate(-3 32 34)">
    <!-- V4：装订环（先画，压住下半截） -->
    <rect x="21.5" y="10.5" width="3.5" height="9" rx="1.75" fill="#9aa7b8"/>
    <rect x="38.5" y="10.5" width="3.5" height="9" rx="1.75" fill="#9aa7b8"/>

    <!-- 日历页本体 -->
    <rect x="12" y="15" width="40" height="40" rx="5" fill="#ffffff"/>

    <!-- V4：蓝色抬头 + 太阳 + 标题行 -->
    <path d="M17 15 H47 Q52 15 52 20 V28 H12 V20 Q12 15 17 15 Z" fill="#3d7bfb"/>
    <circle cx="17.5" cy="21.5" r="2.6" fill="#ffd54f"/>
    <rect x="23" y="18.6" width="14" height="2.4" rx="1.2" fill="#ffffff" opacity="0.9"/>
    <rect x="23" y="22.6" width="9" height="2.4" rx="1.2" fill="#ffffff" opacity="0.55"/>

    <!-- V3：左侧日报正文行 -->
    <rect x="16" y="31.5" width="14" height="2.6" rx="1.3" fill="#c3cbd8"/>
    <rect x="16" y="36.5" width="11" height="2.6" rx="1.3" fill="#c3cbd8"/>
    <rect x="16" y="41.5" width="13" height="2.6" rx="1.3" fill="#c3cbd8"/>
    <rect x="16" y="46.5" width="9" height="2.6" rx="1.3" fill="#c3cbd8"/>

    <!-- V2：右侧折线 + 橙色高亮点 -->
    <polyline points="33,45 38,39 42,42 47,33" fill="none" stroke="#2f6bf0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="33" cy="45" r="1.8" fill="#2f6bf0"/>
    <circle cx="38" cy="39" r="1.8" fill="#2f6bf0"/>
    <circle cx="42" cy="42" r="1.8" fill="#2f6bf0"/>
    <circle cx="47" cy="33" r="2.4" fill="#ff7043"/>
  </g>
</svg>
