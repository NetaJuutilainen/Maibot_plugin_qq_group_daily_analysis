<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa7ff"/>
      <stop offset="1" stop-color="#2f6bf0"/>
    </linearGradient>
  </defs>

  <!-- 地面软阴影 -->
  <ellipse cx="36" cy="60" rx="14" ry="2.4" fill="#000000" opacity="0.12"/>

  <!-- 每日太阳（先画，从气泡左上角探出） -->
  <g>
    <circle cx="11" cy="11" r="4.5" fill="#ffd54f" stroke="#f9a825" stroke-width="1.2"/>
    <g stroke="#f9a825" stroke-width="2" stroke-linecap="round">
      <path d="M11 5.2 V2.8"/>
      <path d="M11 16.8 V19.2"/>
      <path d="M16.8 11 H19.2"/>
      <path d="M5.2 11 H2.8"/>
      <path d="M15.1 6.9 L16.8 5.2"/>
      <path d="M6.9 6.9 L5.2 5.2"/>
      <path d="M15.1 15.1 L16.8 16.8"/>
      <path d="M6.9 15.1 L5.2 16.8"/>
    </g>
  </g>

  <!-- 聊天气泡 -->
  <path d="M24 16 H48
           Q58 16 58 26 V40
           Q58 50 48 50 H33
           L22.5 58.5
           C20.8 59.9 19 59 19 56.8
           V49.6
           Q14 48 14 40 V26
           Q14 16 24 16 Z"
        fill="url(#bubble)" stroke="#1d4fc4" stroke-width="1.4" stroke-opacity="0.3"/>

  <!-- 上升趋势柱状图 -->
  <g fill="#ffffff" opacity="0.92">
    <rect x="21" y="37" width="5" height="8" rx="2.5"/>
    <rect x="29.5" y="31" width="5" height="14" rx="2.5"/>
    <rect x="38" y="25" width="5" height="20" rx="2.5"/>
    <rect x="46.5" y="20" width="5" height="25" rx="2.5"/>
  </g>
</svg>
