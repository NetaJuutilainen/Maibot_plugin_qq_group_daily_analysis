<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="群聊每日分析 · MaiBot Group Daily Analysis">
  <defs>
    <linearGradient id="dayBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f1f6ff"/>
      <stop offset="100%" stop-color="#e5efff"/>
    </linearGradient>
    <linearGradient id="dayIconBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3c6e"/>
      <stop offset="100%" stop-color="#131c33"/>
    </linearGradient>
    <radialGradient id="dayGlowBlue" cx="0.82" cy="0.28" r="0.45">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dayGlowWarm" cx="0.92" cy="0.85" r="0.35">
      <stop offset="0%" stop-color="#ff7043" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ff7043" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dayGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-width="0.7" stroke-opacity="0.18"/>
    </pattern>
    <clipPath id="dayCardClip">
      <rect x="4" y="4" width="1192" height="292" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#dayCardClip)">
    <!-- Background -->
    <rect x="4" y="4" width="1192" height="292" rx="20" fill="url(#dayBg)"/>
    <rect x="4" y="4" width="1192" height="292" fill="url(#dayGrid)"/>
    <rect x="4" y="4" width="1192" height="292" fill="url(#dayGlowBlue)"/>
    <rect x="4" y="4" width="1192" height="292" fill="url(#dayGlowWarm)"/>

    <!-- Subtle decorative circles on the right -->
    <circle cx="990" cy="150" r="165" fill="none" stroke="#3d7bfb" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="6 6"/>
    <circle cx="990" cy="150" r="126" fill="none" stroke="#2f6bf0" stroke-width="1" stroke-opacity="0.16"/>

    <!-- Decorative mini analytics card behind icon -->
    <g transform="translate(768, 174)">
      <rect x="0" y="0" width="144" height="82" rx="12" fill="#ffffff" fill-opacity="0.92" stroke="#dbeafe" stroke-width="1.2"/>
      <rect x="14" y="14" width="52" height="6" rx="3" fill="#94a3b8" fill-opacity="0.45"/>
      <rect x="14" y="26" width="32" height="4" rx="2" fill="#cbd5e1"/>
      <rect x="16" y="54" width="10" height="16" rx="3" fill="#bfdbfe"/>
      <rect x="32" y="46" width="10" height="24" rx="3" fill="#93c5fd"/>
      <rect x="48" y="38" width="10" height="32" rx="3" fill="#60a5fa"/>
      <rect x="64" y="48" width="10" height="22" rx="3" fill="#93c5fd"/>
      <rect x="80" y="34" width="10" height="36" rx="3" fill="#3d7bfb"/>
      <rect x="96" y="42" width="10" height="28" rx="3" fill="#60a5fa"/>
      <rect x="112" y="30" width="10" height="40" rx="3" fill="#ff7043"/>
    </g>

    <!-- Decorative mini comic/theme badge top-right -->
    <g transform="translate(1056, 44)">
      <rect x="0" y="0" width="94" height="40" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#dbeafe" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="6" fill="#ffd54f"/>
      <rect x="34" y="13" width="44" height="5" rx="2.5" fill="#3d7bfb" fill-opacity="0.75"/>
      <rect x="34" y="23" width="30" height="4" rx="2" fill="#cbd5e1"/>
    </g>

    <!-- Scaled icon.svg centerpiece -->
    <g transform="translate(886, 46) scale(3.25)">
      <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#dayIconBg)"/>
      <ellipse cx="32" cy="57.5" rx="17" ry="2.2" fill="#000000" opacity="0.35"/>
      <g transform="rotate(-3 32 34)">
        <rect x="21.5" y="10.5" width="3.5" height="9" rx="1.75" fill="#9aa7b8"/>
        <rect x="38.5" y="10.5" width="3.5" height="9" rx="1.75" fill="#9aa7b8"/>
        <rect x="12" y="15" width="40" height="40" rx="5" fill="#ffffff"/>
        <path d="M17 15 H47 Q52 15 52 20 V28 H12 V20 Q12 15 17 15 Z" fill="#3d7bfb"/>
        <circle cx="17.5" cy="21.5" r="2.6" fill="#ffd54f"/>
        <rect x="23" y="18.6" width="14" height="2.4" rx="1.2" fill="#ffffff" opacity="0.9"/>
        <rect x="23" y="22.6" width="9" height="2.4" rx="1.2" fill="#ffffff" opacity="0.55"/>
        <rect x="16" y="31.5" width="14" height="2.6" rx="1.3" fill="#c3cbd8"/>
        <rect x="16" y="36.5" width="11" height="2.6" rx="1.3" fill="#c3cbd8"/>
        <rect x="16" y="41.5" width="13" height="2.6" rx="1.3" fill="#c3cbd8"/>
        <rect x="16" y="46.5" width="9" height="2.6" rx="1.3" fill="#c3cbd8"/>
        <polyline points="33,45 38,39 42,42 47,33" fill="none" stroke="#2f6bf0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="33" cy="45" r="1.8" fill="#2f6bf0"/>
        <circle cx="38" cy="39" r="1.8" fill="#2f6bf0"/>
        <circle cx="42" cy="42" r="1.8" fill="#2f6bf0"/>
        <circle cx="47" cy="33" r="2.4" fill="#ff7043"/>
      </g>
    </g>

    <!-- Left typography block -->
    <g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <!-- Eyebrow pill -->
      <rect x="72" y="46" width="8" height="20" rx="4" fill="#3d7bfb"/>
      <text x="90" y="61" font-size="15" font-weight="600" letter-spacing="1.2" fill="#2f6bf0">MaiBot Plugin · Group Daily Analysis</text>

      <!-- Main Title -->
      <text x="72" y="128" font-size="54" font-weight="800" fill="#131c33">群聊每日分析</text>

      <!-- Subtitle -->
      <text x="72" y="172" font-size="21" font-weight="500" fill="#475569">话题 · 称号 · 金句 · 锐评 · 四格漫画 · WebUI 控制台</text>

      <!-- Feature Pills -->
      <g font-size="14.5" font-weight="600" text-anchor="middle">
        <rect x="72" y="206" width="138" height="36" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
        <text x="141" y="229" fill="#1e40af">12 套日报主题</text>

        <rect x="224" y="206" width="138" height="36" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
        <text x="293" y="229" fill="#1e40af">17 套漫画风格</text>

        <rect x="376" y="206" width="152" height="36" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
        <text x="452" y="229" fill="#1e40af">本地零外发渲染</text>

        <rect x="542" y="206" width="136" height="36" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
        <text x="610" y="229" fill="#c2410c">LLM 原生工具</text>
      </g>
    </g>
  </g>

  <!-- Outer Card Border -->
  <rect x="4" y="4" width="1192" height="292" rx="20" fill="none" stroke="#dbeafe" stroke-width="2"/>
</svg>
